    <script>
      let typeInputEl = null;
      let typeSubmitBtnEl = null;
      let nextBtnEl = null;

      let flipAnswerAreaEl = null;
      let flipSubmitEl = null;
      let overrideBtnEl = null;
      let quickAddRequestId = 0;
      let quickAddPendingCalls = 0;
      let quickAddMergedResults = null;
      const audioCache = new Map();
      let quickAddSourceIndex = new Map();
      let quickAddCardIndex = new Map();
      let languageSelectsInitialized = false;
      function initDomCache() {
        typeInputEl = $('typeInput');
        typeSubmitBtnEl = $('typeSubmitBtn');
        nextBtnEl = $('nextBtn');
        revealBtnEl = $('revealBtn');
        flipAnswerAreaEl = $('flipAnswerArea');
        flipSubmitEl = $('flipSubmitBtn');
        overrideBtnEl = $('overrideBtn');
      }
      function ensureDomCache() {
        if (!typeInputEl || !typeSubmitBtnEl || !nextBtnEl || !revealBtnEl || !flipAnswerAreaEl || !flipSubmitEl || !overrideBtnEl) {
          initDomCache();
        }
      }
      function showCustomAlert(message) {
        const t = i18n[currentUiLang] || i18n.en;
        $('customDialogTitle').innerText = t.notice || "Notice";
        $('customDialogText').innerText = message;
        $('customDialogInput').style.display = 'none';
        $('btnDialogCancel').style.display = 'none';
        $('btnDialogConfirm').innerText = t.ok || "OK";
        $('btnDialogConfirm').onclick = () => { $('customDialogModal').style.display = 'none'; };
        $('customDialogModal').style.display = 'flex';
      }
      function showCustomPrompt(message, defaultValue, callback) {
        const t = i18n[currentUiLang] || i18n.en;
        $('customDialogTitle').innerText = t.inputRequired || "Input Required";
        $('customDialogText').innerText = message;
        const inputEl = $('customDialogInput');
        inputEl.style.display = 'block';
        inputEl.value = defaultValue || '';
        $('btnDialogCancel').style.display = 'block';
        $('btnDialogCancel').innerText = t.cancel || "Cancel";
        $('btnDialogCancel').onclick = () => { $('customDialogModal').style.display = 'none'; if(callback) callback(null); };
        $('btnDialogConfirm').innerText = t.ok || "OK";
        $('btnDialogConfirm').onclick = () => { $('customDialogModal').style.display = 'none'; if(callback) callback(inputEl.value); };
        $('customDialogModal').style.display = 'flex';
        setTimeout(() => inputEl.focus(), 100);
      }
      function countWords(str) {
        if (!str) return 0;
        return str.trim().split(/\s+/).filter(Boolean).length;
      }
      function validateTextFields(fields, warningId) {
        const warningDiv = $(warningId);
        const t = i18n[currentUiLang] || i18n.en;
        const messages = fields.filter(field => field.count > 20).map(field => `${field.label} (${field.count}/20 words)`);
        const hasError = messages.length > 0;
        if (hasError) {
          warningDiv.style.display = 'block';
          warningDiv.innerText = `${t.wordLimitExceeded}: ${messages.join(', ')}. ${t.shortenToProceed || "Please shorten to proceed."}`;
        } else {
          warningDiv.style.display = 'none';
          warningDiv.innerText = '';
        }
        return hasError;
      }
      function validateTranslateInputs() {
        const sourceCount = countWords($('transSourceInput').value);
        const resultCount = countWords($('transResultInput').value);
        const invalid = validateTextFields([{ label: 'Source', count: sourceCount }, { label: 'Result', count: resultCount }], 'transWordWarning');
        $('btnSaveTransCard').disabled = invalid;
        $('btnRunTranslate').disabled = sourceCount > 20;
      }
      function validateEditInputs() {
        const invalid = validateTextFields([
          { label: 'Front', count: countWords($('editFrontInput').value) },
          { label: 'Back', count: countWords($('editBackInput').value) }
        ], 'editWordWarning');
        $('btnSaveEdit').disabled = invalid;
      }
      function detectDefaultUiLanguage() {
        const saved = localStorage.getItem('srs_ui_lang');

          if (!rawRows || rawRows.length === 0) return (colIdx === 0 ? 'no' : 'en');
          let sampleText = "";

              if(rawRows[i] && rawRows[i][colIdx]) {
                  sampleText += " " + rawRows[i][colIdx].toString().toLowerCase() + " ";
              }
          }
          const langSignatures = {
              en: { chars: [], words: [" the ", " be ", " to ", " of ", " and ", " in ", " that ", " have ", " it ", " is "] },
              no: { chars: ["æ", "ø", "å"], words: [" og ", " det ", " er ", " til ", " en ", " av ", " for ", " med ", " at ", " ikke ", " som ", " på ", " vi "] },
              it: { chars: ["à", "è", "é", "ì", "í", "ò", "ù"], words: [" il ", " di ", " la ", " un ", " in ", " che ", " non ", " sono ", " con ", " una ", " per "] },
              es: { chars: ["ñ", "¿", "¡", "á", "é", "í", "ó", "ú"], words: [" el ", " de ", " que ", " en ", " un ", " ser ", " se ", " no ", " por ", " con ", " la ", " para "] },
              fr: { chars: ["œ", "ç", "à", "â", "é", "è", "ê", "ë", "î", "ï", "ô", "ù", "û", "ü"], words: [" le ", " de ", " un ", " est ", " et ", " il ", " les ", " en ", " que ", " la ", " pour "] },
              de: { chars: ["ä", "ö", "ü", "ß"], words: [" der ", " die ", " und ", " in ", " den ", " von ", " zu ", " das ", " mit ", " sich ", " auf ", " für "] }
          };
          let scores = { en: 0, no: 0, it: 0, es: 0, fr: 0, de: 0 };
          for (const [lang, sig] of Object.entries(langSignatures)) {
              sig.chars.forEach(char => {
                  let matches = sampleText.split(char).length - 1;
                  scores[lang] += matches * 5;

              sig.words.forEach(word => {
                  let matches = sampleText.split(word).length - 1;
                  scores[lang] += matches * 2;

          let maxScore = 0;
          for (const [lang, score] of Object.entries(scores)) {

                  maxScore = score;
                  bestLang = lang;
              }

      }
      function initLanguages() {

        let savedHeaderA = localStorage.getItem('srs_headerA_' + savedDeckId);
        let savedHeaderB = localStorage.getItem('srs_headerB_' + savedDeckId);

        let codeB = savedB || detectLangFromRows(1, rawData.rawRows);

        let idxA = savedHeaderA ? rawData.headers.indexOf(savedHeaderA) : -1;
        let idxB = savedHeaderB ? rawData.headers.indexOf(savedHeaderB) : -1;
        if (idxA < 0 && hint) idxA = hint.idxA;
        if (idxB < 0 && hint) idxB = hint.idxB;
        if (idxA < 0) idxA = 0;
        if (idxB < 0 || idxB === idxA) idxB = idxA === 0 ? 1 : 0;
        selectedPair = { idxA: idxA, idxB: idxB, codeA: codeA, codeB: codeB, headerA: rawData.headers[idxA], headerB: rawData.headers[idxB] };
        resolvePairColumns();
        localStorage.setItem('srs_headerA_' + savedDeckId, selectedPair.headerA || '');

      function findLanguageHeader(code, excludedIdx) {
        if (!rawData || !rawData.headers) return -1;
        const terms = [code, getNativeLangName(code)].filter(Boolean).map(term => term.toLowerCase());
        return rawData.headers.findIndex((header, index) => {
          if (index === excludedIdx || header.trim().toLowerCase() === 'srs card id') return false;
          const normalized = header.toLowerCase();

      function resolvePairColumns() {
        if (!rawData || !rawData.headers || !selectedPair) return;

        const idxA = selectedPair.headerA ? rawData.headers.indexOf(selectedPair.headerA) : -1;
        const idxB = selectedPair.headerB ? rawData.headers.indexOf(selectedPair.headerB) : -1;
        selectedPair.idxA = idxA >= 0 ? idxA : findLanguageHeader(selectedPair.codeA, -1);
        selectedPair.idxB = idxB >= 0 ? idxB : findLanguageHeader(selectedPair.codeB, selectedPair.idxA);
        if (selectedPair.idxA < 0) selectedPair.idxA = 0;
        if (selectedPair.idxB < 0 || selectedPair.idxB === selectedPair.idxA) selectedPair.idxB = selectedPair.idxA === 0 ? 1 : 0;

      function cleanString(str) {

        if (!str) return '';

      function levenshteinDistance(a, b) {
        // Dynamic programming gives edit distance for typing mode without an
        // external dependency; callers decide what distance is acceptable.
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
            else { matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1); }

      }
