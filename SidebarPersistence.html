    <script>
      function handleWindowToggle() {
        if (window.innerWidth > 400) {
          google.script.run.withSuccessHandler(() => { if (google.script.host && google.script.host.close) { google.script.host.close(); } }).showFlashcardSidebar();
        } else {
          google.script.run.showFlashcardDialog();
        }
      }
      document.addEventListener('keydown', function(e) {
        ensureDomCache();
        const quizView = $('viewQuiz');
        if (!quizView || quizView.style.display === 'none') return;
        const activeEl = document.activeElement;
        const isTypingInput = activeEl && activeEl.tagName === 'INPUT';
        if (isTypingInput && (e.key === 'Enter' || e.key === ' ')) return;
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (currentMode === 'flip' && revealBtnEl && revealBtnEl.style.display !== 'none') { revealFlip(); }
          else if (nextBtnEl && nextBtnEl.style.display !== 'none') {
            if (Date.now() - lastFeedbackTime < 600) return;
            renderNextCard();
          }
        }
        if (currentMode === 'flip') {
          if (flipAnswerAreaEl && flipAnswerAreaEl.style.display !== 'none') {
            if (e.key === '1') { e.preventDefault(); submitAnswer(false, 'again'); }
            if (e.key === '2') { e.preventDefault(); submitAnswer(true, 'hard'); }
            if (e.key === '3') { e.preventDefault(); submitAnswer(true, 'good'); }
            if (e.key === '4') { e.preventDefault(); submitAnswer(true, 'easy'); }
          }
        } else if (currentMode === 'mcq' || currentMode === 'cloze_mcq') {
          if (['1', '2', '3', '4'].includes(e.key)) {
            e.preventDefault();
            const idx = parseInt(e.key, 10) - 1;
            const mcqBtn = $(`mcq${idx}`);
            if (mcqBtn && !mcqBtn.disabled) checkMCQ(idx);
          }
        } else if (currentMode === 'tf') {
          if (e.key.toLowerCase() === 't' || e.key === '1') {
            e.preventDefault();
            const trueBtn = $('tfTrueBtn');
            if (trueBtn && !trueBtn.disabled) checkTF(true);
          } else if (e.key.toLowerCase() === 'f' || e.key === '2') {
            e.preventDefault();
            const falseBtn = $('tfFalseBtn');
            if (falseBtn && !falseBtn.disabled) checkTF(false);
          }
        }
      });
      window.onload = function() {
        initDomCache();
        const savedTheme = localStorage.getItem('srs_app_theme') || 'kurskollektivet';
        changeAppTheme(savedTheme);
        setupLifecycleSync();
        updateWindowModeUI(); window.onresize = updateWindowModeUI;
        try {
          if (typeof window.URL_DECK_ID !== 'undefined') localStorage.setItem('srs_selected_deck_id', window.URL_DECK_ID.trim());
          const urlParams = new URLSearchParams(window.location.search);
          const deckId = urlParams.get('deck');
          if (deckId && deckId.trim().length > 0 && deckId !== 'undefined') { localStorage.setItem('srs_selected_deck_id', deckId.trim()); }
        } catch(e) {}
        const defaultLang = detectDefaultUiLanguage(); applyUiLanguage(defaultLang);
        initPreflightFlow();
      };
      function initPreflightFlow() {
        $('loading-ui').style.display = 'block'; $('main-ui').style.display = 'none';
        loadFlashcardData(function(error) {
          console.error("Initialization Failed:", error);
          showCustomAlert("Error loading flashcard data. Ensure you have access to the Google Spreadsheet.");
        });
      }
      function loadFlashcardData(onFailure) {
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "";
        google.script.run
          .withSuccessHandler(initApp)
          .withFailureHandler(onFailure || (() => { showCustomAlert("Error loading flashcard data. Ensure you have access to the Google Spreadsheet."); }))
          .getFlashcardData(savedDeckId, getClientTodayStr(), getClientTimeZone());
      }
      function fetchData(onFailure) { loadFlashcardData(onFailure); }
      function initApp(data) {
        $('loading-ui').style.display = 'none'; $('main-ui').style.display = 'block';
        const pendingCardIds = new Set((pendingBatchResults || []).map(result => result.cardId));
        const pendingDates = new Set((pendingBatchResults || []).map(result => result.lastReviewed));
        if (rawData && rawData.savedProgress && data && data.savedProgress) {
          pendingCardIds.forEach(cardId => {
            if (rawData.savedProgress[cardId]) data.savedProgress[cardId] = rawData.savedProgress[cardId];
          });
        }
        if (data) {
          const serverStudied = data.studiedToday || { newCount: 0, oldCount: 0 };
          const pendingToday = (pendingBatchResults || []).filter(result => result.lastReviewed === data.todayStr);
          data.studiedToday = {
            newCount: (serverStudied.newCount || 0) + pendingToday.filter(result => result.wasNew).length,
            oldCount: (serverStudied.oldCount || 0) + pendingToday.filter(result => !result.wasNew).length
          };
        }
        if (rawData && rawData.studyHistory && data && pendingDates.size > 0) {
          const mergedHistory = Object.assign({}, data.studyHistory || {});
          pendingDates.forEach(function(dateKey) {
            var serverVal = parseInt(mergedHistory[dateKey] || 0, 10) || 0;
            var localVal = parseInt(rawData.studyHistory[dateKey] || 0, 10) || 0;
            mergedHistory[dateKey] = Math.max(serverVal, localVal);
          });
          data.studyHistory = mergedHistory;
        }
        rawData = data;
        activeUserKey = data.activeUserKey;
        $('loggedInUser').innerText = data.activeUserEmail ? 'Logged in as: ' + data.activeUserEmail : 'Logged-in account unavailable';
        currentWebAppUrl = data.webAppUrl || "Not available";
        $('webAppUrlInput').value = currentWebAppUrl;
        $('dashDeckName').innerText = data.ssName || "Spreadsheet Deck";
        initLanguages();
        if (dashboardRefreshPending) {
          dashboardRefreshPending = false;
          isFlushInFlight = false;
        }
        processCardsForActivePair();
      }
      const INTERVAL_STAGES = [1 / 24, 3, 7, 14, 30, 60, 90, 180, 359, 360];
      function getStageFromInterval(ivl, isNew) {
        if (isNew || ivl < 1) return 1;
        for (let i = 1; i < INTERVAL_STAGES.length; i++) {
          if (ivl <= INTERVAL_STAGES[i]) return i + 1;
        }
        return INTERVAL_STAGES.length;
      }
      function getIntervalForStage(stage) {
        const index = Math.max(1, Math.min(INTERVAL_STAGES.length, parseInt(stage, 10) || 1)) - 1;
        return INTERVAL_STAGES[index];
      }
    </script>
