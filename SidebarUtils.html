        $('customDialogModal').style.display = 'flex';

      }
      function countWords(str) {
        if (!str) return 0;
        return str.trim().split(/\s+/).filter(Boolean).length;
      }
      function validateTextFields(fields, warningId) {
        const warningDiv = $(warningId);
        const t = i18n[currentUiLang] || i18n.en;
        const messages = fields.filter(field => field.count > 20).map(field => `${field.label} (${field.count}/20 words)`);
        const hasError = messages.length > 0;
        if (hasError) {
          warningDiv.style.display = 'block';

        } else {
          warningDiv.style.display = 'none';

        }
        return hasError;
      }
      function validateTranslateInputs() {

        $('btnSaveTransCard').disabled = invalid;
        $('btnRunTranslate').disabled = sourceCount > 20;
      }
      function validateEditInputs() {

      }
      function detectDefaultUiLanguage() {

        if (navLang.startsWith('no') || navLang.startsWith('nb') || navLang.startsWith('nn')) return 'no';
        if (navLang.startsWith('it')) return 'it';
        return 'en';
      }
      function changeAppTheme(theme) {

      }

        const t = i18n[langCode];
        const localizedText = {
          lblLangCombo: 'langCombo', lblSelectedDeck: 'selectedDeck', btnSwitchDeck: 'switchDeck', btnEditCard: 'editCard',
          btnWebApp: 'webAppBtn', lblWebAppTitle: 'webAppTitle', lblWebAppDesc: 'webAppDesc', btnCancelWebApp: 'close',
          lblEditModalTitle: 'editModalTitle', lblEditFront: 'editFront', lblEditBack: 'editBack', btnSaveEdit: 'saveSheet',
          btnCancelEdit: 'cancel', openTranslatorBtn: 'openTranslator', lblTranslateTitle: 'translateModalTitle',
          lblTransDir: 'transDir', lblLookUpText: 'lookUpText', btnRunTranslate: 'runTranslate', lblSelectBestTrans: 'selectBestTrans',
          lblResultText: 'resultText', btnCancelTranslate: 'close', lblStudiedToday: 'studiedToday', lblStudyConsistency: 'consistency',
          lblDeckMastery: 'deckMastery', optRangeWeek: 'rangeWeek', optRangeMonth: 'rangeMonth', optRangeYear: 'rangeYear',
          lblLess: 'less', lblMore: 'more', lblNew: 'newLabel', lblReview: 'reviewLabel', startLeechBtn: 'studyLeeches',
          revealBtn: 'reveal', typeSubmitBtn: 'submit', nextBtn: 'nextCard', lblListen: 'listen', lblListenAns: 'listenAns',
          lblOverride: 'override', lblAutoAudio: 'autoAudio', lblConfAgain: 'confAgain', lblConfHard: 'confHard',
          lblConfGood: 'confGood', lblConfEasy: 'confEasy', btnResetTiles: 'resetTiles', btnSubmitTiles: 'submitOrder',
          tfSubheader: 'tfHeader', tfTrueBtn: 'trueBtn', tfFalseBtn: 'falseBtn', lblSegmentPerf: 'segmentPerf',
          lblAccuracy: 'accuracy', lblCorrectAns: 'correctAns', lblPracticeNeeded: 'practiceNeeded', lblNewLearnt: 'newLearnt',
          lblReviewPracticed: 'reviewPracticed', lblCantListen: 'cantListen'

        $('btnCopyWebApp').innerText = "📋 " + t.copyLink;
        $('btnSaveTransCard').innerText = t.addCardToDeck || "➕ Add to Deck";
        $('btnViewStudied').innerText = "📋 " + t.viewList;
        const btnArchive = $('btnArchive'); if(btnArchive) btnArchive.innerText = "🗃️ " + t.archiveMastered;
        const lblRewards = $('lblRewards'); if(lblRewards) lblRewards.innerText = "🏅 " + t.rewards;
        const returnDashBtn = $('returnDashBtn');
        if(returnDashBtn && !returnDashBtn.innerText.includes("Loading")) returnDashBtn.innerText = t.returnDash;
        const returnDashSummaryBtn = $('returnDashSummaryBtn');
        if(returnDashSummaryBtn && !returnDashSummaryBtn.innerText.includes("Loading")) returnDashSummaryBtn.innerText = t.returnDash;
        const lblDidYouMean = $('lblDidYouMean'); if (lblDidYouMean) lblDidYouMean.innerText = t.didYouMean || "Did you mean:";
        const rewardBtn = $('btnRewardDismiss'); if (rewardBtn) rewardBtn.innerText = t.woohoo || "Woohoo!";
        const lblInitializing = $('lblInitializing'); if (lblInitializing) lblInitializing.innerText = t.initializing || "Initializing...";
        const lblStudiedModalTitle = $('lblStudiedModalTitle'); if (lblStudiedModalTitle) lblStudiedModalTitle.innerText = t.studiedModalTitle || "Cards Studied Today";
        const btnStudiedModalClose = $('btnStudiedModalClose'); if (btnStudiedModalClose) btnStudiedModalClose.innerText = t.close || "Close";
        const themeSel = $('themeSelectUI');
        if (themeSel) {

      function changeUiLanguage(newLang) { applyUiLanguage(newLang); }
      function getClientTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      function getClientTimeZone() {
        try {
          const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          return (tz && typeof tz === 'string') ? tz : 'UTC';
        } catch (e) {
          return 'UTC';
        }
      }
      function openWebAppModal() { $('webAppModal').style.display = 'flex'; }
      function closeWebAppModal() { $('webAppModal').style.display = 'none'; const t = i18n[currentUiLang] || i18n.en; $('btnCopyWebApp').innerText = "📋 " + (t.copyLink || "Copy Link"); }
      function renderCardListModal(cards, title) {
        if (!cards || cards.length === 0) return;

        const t = i18n[currentUiLang] || i18n.en;

        listEl.replaceChildren();

          const row = document.createElement('div');
          row.className = 'studied-card-row';
          const text = document.createElement('div');
          text.className = 'studied-card-text';
          const front = document.createElement('strong');
          front.textContent = card.front;
          text.appendChild(front);
          text.appendChild(document.createElement('br'));
          const back = document.createElement('span');
          back.style.color = 'var(--text-muted)';
          back.textContent = card.back;
          text.appendChild(back);
          const actionGroup = document.createElement('div');
          actionGroup.className = 'studied-card-actions';
          [
            ['btn-edit-studied', t.editCard || '✏️ Edit', () => openStudiedCardEdit(card)],
            ['btn-archive-studied', t.archiveCard || '🗃️ Archive', button => archiveListedCard(card, button, row)]
          ].forEach(([className, label, handler]) => {
            const button = document.createElement('button');
            button.type = 'button'; button.className = className;
            button.textContent = label; button.title = label;
            button.addEventListener('click', () => handler(button));
            actionGroup.appendChild(button);
          });
          row.appendChild(text);
          row.appendChild(actionGroup);
          listEl.appendChild(row);
        });
        $('studiedCardsModal').style.display = 'flex';
      }
      function archiveListedCard(card, button, row) {
        if (!card || !button) return;
        const t = i18n[currentUiLang] || i18n.en;
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || '';
        button.disabled = true;
        button.innerText = '⏳';
        runServerMutation('archiveSingleCard', [card.rowIndex, savedDeckId, card.id, card.colIdxA, card.colIdxB], res => {
            if (res && res.success) {
              if (row) row.remove();
              $('studiedCardsModal').style.display = 'none';
              fetchData();
            } else {
              button.disabled = false;
              button.innerText = t.archiveCard || '🗃️ Archive';
              showCustomAlert('Error archiving card: ' + ((res && (res.error || res.message)) || 'Unknown error'));
            }
          }, error => {
            button.disabled = false;
            button.innerText = t.archiveCard || '🗃️ Archive';
            showCustomAlert('Connection Error: ' + error);
          });
      }
      function openStudiedModal() {
        const t = i18n[currentUiLang] || i18n.en;
        renderCardListModal(studiedTodayPool, t.studiedModalTitle || 'Cards Studied Today');
      }
      function openStageModal(stage) {
        const stageCards = allCards.filter(card => getStageFromInterval(card.interval, card.isNew) === stage);
        const t = i18n[currentUiLang] || i18n.en;
        const title = `${t['stage' + stage] || `Stage ${stage}`} (${stageCards.length})`;
        renderCardListModal(stageCards, title);
      }
      function copyWebAppLink() {
        const input = $('webAppUrlInput');
        input.select(); input.setSelectionRange(0, 99999);
        if (navigator.clipboard) { navigator.clipboard.writeText(input.value).then(() => { const t = i18n[currentUiLang] || i18n.en; $('btnCopyWebApp').innerText = "✅ " + (t.copied || "Copied!"); }).catch(err => { document.execCommand("copy"); const t = i18n[currentUiLang] || i18n.en; $('btnCopyWebApp').innerText = "✅ " + (t.copied || "Copied!"); }); } else { document.execCommand("copy"); const t = i18n[currentUiLang] || i18n.en; $('btnCopyWebApp').innerText = "✅ " + (t.copied || "Copied!"); }
      }
      function getNativeLangName(code) {
          return LANGUAGE_NAMES[code] || code.toUpperCase();
      }
      function getAvailableLanguages() {
        const languages = new Map();
        (rawData && rawData.headers || []).forEach(header => {
          if (header.trim().toLowerCase() === 'srs card id') return;
          const code = Object.keys(LANGUAGE_NAMES).find(key => header.toLowerCase().includes(key)) || header.toLowerCase().trim();
          languages.set(code, { code: code, name: LANGUAGE_NAMES[code] || header });
        });
        [selectedPair && selectedPair.codeA, selectedPair && selectedPair.codeB].forEach(code => {
          if (code && !languages.has(code)) languages.set(code, { code: code, name: getNativeLangName(code) });
        });
        return Array.from(languages.values());
      }
      function updatePairSelectUI() {
        const selA = $('langASelect');
        const selB = $('langBSelect');
        if (!selA || !selB || !selectedPair) return;
        if (!languageSelectsInitialized) {
          selA.replaceChildren();
          selB.replaceChildren();
          const languages = getAvailableLanguages();
          [['langASelect', languages], ['langBSelect', languages]].forEach(([id, options]) => {
            const fragment = document.createDocumentFragment();
            options.forEach(lang => {
              const option = document.createElement('option');
              option.value = lang.code; option.innerText = lang.name;
              fragment.appendChild(option);
            });
            $(id).appendChild(fragment);
          });
          languageSelectsInitialized = true;
        }
        selA.value = selectedPair.codeA;
        selB.value = selectedPair.codeB;
        selA.onchange = () => {
          resolvePairColumns();
            selectedPair.codeA = selA.value;
          selectedPair.headerA = rawData && rawData.headers ? rawData.headers[selectedPair.idxA] : selectedPair.headerA;
            const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "default";
            localStorage.setItem('srs_langA_' + savedDeckId, selA.value);
            processCardsForActivePair();
        };
        selB.onchange = () => {
          resolvePairColumns();
            selectedPair.codeB = selB.value;
          selectedPair.headerB = rawData && rawData.headers ? rawData.headers[selectedPair.idxB] : selectedPair.headerB;
            const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "default";
            localStorage.setItem('srs_langB_' + savedDeckId, selB.value);
            processCardsForActivePair();
        };
      }
      function openTranslateModal() {
        $('transSourceInput').value = ''; $('transResultInput').value = ''; $('transResultsArea').style.display = 'none'; $('spellcheckArea').style.display = 'none';
        const dirSelect = $('transDirSelect'); dirSelect.replaceChildren();
        if (selectedPair) {
          const nameA = getNativeLangName(selectedPair.codeA);
          const nameB = getNativeLangName(selectedPair.codeB);
          const optForward = document.createElement('option'); optForward.value = 'forward'; optForward.innerText = `${nameA} ➔ ${nameB}`;
          const optReverse = document.createElement('option'); optReverse.value = 'reverse'; optReverse.innerText = `${nameB} ➔ ${nameA}`;
          dirSelect.appendChild(optForward); dirSelect.appendChild(optReverse);
        }
        validateTranslateInputs();
        $('translateModal').style.display = 'flex';
        setTimeout(() => { $('transSourceInput').focus(); }, 100);
      }
      function closeTranslateModal() { $('translateModal').style.display = 'none'; }
      function findQuickAddSourceDuplicate(sourceText, dirValue) {
        const cleanSource = cleanString(sourceText);
        if (!cleanSource || !Array.isArray(allCards)) return null;
        return quickAddSourceIndex.get((dirValue === 'forward' ? 'a:' : 'b:') + cleanSource) || null;
      }
      function showQuickAddDuplicate(card) {
        showCustomAlert(`⚠️ This source already exists in your deck:\n\n${card.front} ➔ ${card.back}`);
      }
      function setQuickAddBusy(isBusy) {
        const button = $('btnRunTranslate');
        if (button) button.disabled = isBusy;
      }
      function runServerMutation(method, args, onSuccess, onFailure) {
        const runner = google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure || showCustomAlert);
        runner[method].apply(runner, args);
      }
      function renderTranslationResults(res, requestId) {
        if (requestId !== quickAddRequestId) return;
        const providers = [
          ['google', 'optGoogleTrans', 'optGoogleTransText'],
          ['deepl', 'optDeeplTrans', 'optDeeplTransText'],
          ['gemini', 'optGeminiTrans', 'optGeminiTransText']
        ];
        $('transResultsArea').style.display = 'flex';
        providers.forEach(([key, buttonId, textId]) => {
          const value = res && res.success && typeof res[key] === 'string' && res[key].trim() && !/unavailable| error/i.test(res[key]) ? res[key].trim() : '';
          const button = $(buttonId);
          button.style.display = 'flex';
          $(textId).innerText = value || (key === 'google' && res && res.googleError ? 'Unavailable: ' + res.googleError : 'Unavailable');
          button.setAttribute('data-val', value);
          const resultInput = $('transResultInput');
          if (value && (!resultInput.value || resultInput.value === 'Fetching translations...')) resultInput.value = value;
        });
        validateTranslateInputs();
      }
      function requestQuickAddTranslation(text, sourceCode, targetCode, requestId) {
        quickAddPendingCalls = 1;
        quickAddMergedResults = { success: true };
        const mergeResult = res => {
          if (requestId !== quickAddRequestId) return;
          if (res && res.success) {
            ['google', 'deepl', 'gemini'].forEach(key => {
              if (res[key] !== undefined) quickAddMergedResults[key] = res[key];
            });
          } else if (res && res.error) {
            quickAddMergedResults.googleError = res.error;
          }
          quickAddPendingCalls--;
          if (quickAddPendingCalls === 0) renderTranslationResults(quickAddMergedResults, requestId);
        };
        google.script.run
          .withSuccessHandler(mergeResult)
          .withFailureHandler(() => mergeResult(null))
          .translateText(text, sourceCode, targetCode, true);
      }
      function requestQuickAddSpelling(text, sourceCode, targetCode, dirValue, requestId) {
        google.script.run
          .withSuccessHandler(res => {
            if (requestId !== quickAddRequestId || !res || !res.success || !res.corrected || res.corrected === 'OK' || res.corrected.trim().toLowerCase() === text.toLowerCase()) return;
            $('spellcheckArea').style.display = 'block';
            $('spellcheckSuggestion').innerText = res.corrected;
            $('spellcheckSuggestion').onclick = (e) => {
              e.preventDefault();
              $('transSourceInput').value = res.corrected.trim();
              runAiTranslation();
            };
          })
          .withFailureHandler(() => {})
          .checkSpelling(text, sourceCode);
      }
      function runAiTranslation() {
        const text = $('transSourceInput').value.trim();
        if (!text) return;
        if (countWords(text) > 20) { validateTranslateInputs(); return; }
        const dirValue = $('transDirSelect').value;
        const codeA = selectedPair ? selectedPair.codeA : 'no';
        const codeB = selectedPair ? selectedPair.codeB : 'en';
        const sourceCode = (dirValue === 'forward') ? codeA : codeB;
        const targetCode = (dirValue === 'forward') ? codeB : codeA;
        const requestId = ++quickAddRequestId;
        const initialDuplicate = findQuickAddSourceDuplicate(text, dirValue);
        if (initialDuplicate) {
          showQuickAddDuplicate(initialDuplicate);
          return;
        }
        setQuickAddBusy(true);
        $('transResultInput').value = "Fetching translations...";
        $('transResultsArea').style.display = 'flex';
        ['optGoogleTransText', 'optDeeplTransText', 'optGeminiTransText'].forEach(id => $(id).innerText = 'Fetching...');
        $('spellcheckArea').style.display = 'none';
        requestQuickAddTranslation(text, sourceCode, targetCode, requestId);
        requestQuickAddSpelling(text, sourceCode, targetCode, dirValue, requestId);
        setQuickAddBusy(false);
      }
      function selectTranslationOption(val) {
        if (!val) return;
        $('transResultInput').value = val.trim(); validateTranslateInputs(); $('transResultInput').focus();
      }
      function saveTranslatedCard() {
        const lookupText = $('transSourceInput').value.trim();
        const translationText = $('transResultInput').value.trim();
        const t = i18n[currentUiLang] || i18n.en;
        if (!lookupText || !translationText || translationText === "Fetching translations...") {
          showCustomAlert("Please look up a translation first.");
          return;
        }
        if (countWords(lookupText) > 20 || countWords(translationText) > 20) {
          validateTranslateInputs();
          return;
        }
        const dirValue = $('transDirSelect').value;
        let cardLangA, cardLangB;
        if (dirValue === 'forward') {
          cardLangA = lookupText;
          cardLangB = translationText;
        } else {
          cardLangA = translationText;
          cardLangB = lookupText;
        }
        const cleanA = cleanString(cardLangA);
        const cleanB = cleanString(cardLangB);
        const duplicateCard = quickAddCardIndex.get(cleanA + ':::' + cleanB);
        if (duplicateCard) {
            showCustomAlert(`⚠️ Duplicate detected!\n\nThis word already exists in your deck as:\n\n${duplicateCard.front} ➔ ${duplicateCard.back}`);
            return;
        }
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "";
        $('btnSaveTransCard').disabled = true;
        $('btnSaveTransCard').innerText = "Saving...";
        google.script.run
          .withSuccessHandler(res => {
            $('btnSaveTransCard').disabled = false; $('btnSaveTransCard').innerText = t.addCardToDeck || "➕ Add to Deck";
            if (res.success) {
              showCustomAlert("🎉 Card added directly to your spreadsheet deck!");
              closeTranslateModal();
              fetchData();
            } else if (res.duplicate) {
              showQuickAddDuplicate({ front: res.front, back: res.back });
            } else {
              showCustomAlert("Error adding card: " + res.error);
            }
          })
          .withFailureHandler(e => { $('btnSaveTransCard').disabled = false; showCustomAlert("Error saving card: " + e); })
          .addNewCardToSheet(cardLangA, cardLangB, savedDeckId, selectedPair.idxA, selectedPair.idxB);
      }
      function openEditModal() {
        if (!currentCard) return;
        $('editFrontInput').value = currentCard.front; $('editBackInput').value = currentCard.back;
        validateEditInputs(); $('editCardModal').style.display = 'flex';
      }
      function openStudiedCardEdit(card) {
        currentCard = card;
        $('studiedCardsModal').style.display = 'none';
        openEditModal();
      }
      function closeEditModal() { $('editCardModal').style.display = 'none'; }
      function saveCardEdit() {
        if (!currentCard) return;
        const newFront = $('editFrontInput').value.trim(); const newBack = $('editBackInput').value.trim();
        if (!newFront || !newBack) { showCustomAlert("Both front and back fields must contain text."); return; }
        if (countWords(newFront) > 20 || countWords(newBack) > 20) { validateEditInputs(); return; }
        const oldCardId = currentCard.id;
        // Update the local card immediately for responsive quiz UI. If the
        // server rejects the write, fetchData() restores the authoritative row.
        currentCard.front = newFront; currentCard.back = newBack;
        if (rawData && rawData.rawRows && currentCard.rowIndex) {
          const row = rawData.rawRows[currentCard.rowIndex - 2];
          if (row) {
            row[currentCard.colIdxA] = newFront;
            row[currentCard.colIdxB] = newBack;
          }
        }
        targetPrompt = isForward ? currentCard.front : currentCard.back; targetAnswer = isForward ? currentCard.back : currentCard.front;
        const dispAnswerLang = getDisplayLangCode(answerLangCode);
        if (currentMode === 'flip') { $('promptMain').innerText = targetPrompt; $('flipAnswerText').innerText = targetAnswer; }
        else if (currentMode === 'word_tiles') { setupWordTiles(); }
        else if (currentMode === 'faded_hints') { setupFadedHints(dispAnswerLang); }
        else { $('promptMain').innerText = targetPrompt; }
        closeEditModal();
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "";
        runServerMutation('updateCardInSheet', [currentCard.rowIndex, currentCard.colIdxA, currentCard.colIdxB, newFront, newBack, savedDeckId, oldCardId], () => {}, e => { showCustomAlert("Error saving to spreadsheet: " + e); fetchData(); });
      }
      function archiveMasteredCards() {
        const btn = $('btnArchive'); if(!btn) return;
        const oldText = btn.innerText; btn.innerText = "⏳ Archiving..."; btn.disabled = true;
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "";
        runServerMutation('archiveMasteredCards', [savedDeckId, selectedPair.idxA, selectedPair.idxB], res => {
            btn.innerText = oldText; btn.disabled = false;
            if (res.success) { showCustomAlert(res.message); if (res.count > 0) fetchData(); } else { showCustomAlert("Error: " + res.message); }
          }, e => { showCustomAlert("Error: " + e); btn.innerText = oldText; btn.disabled = false; });
      }
      function extractSpreadsheetId(urlOrId) {
        if (!urlOrId) return "";
        const match = urlOrId.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (match && match[1]) { return match[1]; }
        return urlOrId.trim();
      }
      function promptSwitchDeck() {
        const t = i18n[currentUiLang] || i18n.en;
        showCustomPrompt(t.deckPrompt, "", (input) => {
          if (input !== null) {
            const cleanInput = input.trim();
            if (cleanInput === "") { localStorage.removeItem('srs_selected_deck_id'); fetchData(); }
            else {
              const extractedId = extractSpreadsheetId(cleanInput);
              if (extractedId) { localStorage.setItem('srs_selected_deck_id', extractedId); fetchData(); }
            }

      }
      function getOrdinal(n) { const s = ["th", "st", "nd", "rd"]; const v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
      function formatDateKey(d) { const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${year}-${month}-${day}`; }
      // Advanced Heuristic Auto-Detection for Rows 2+
      function detectLangFromRows(colIdx, rawRows) {
          // This is a best-effort fallback for decks without saved header
          // metadata; explicit user selections always win in initLanguages().
          if (!rawRows || rawRows.length === 0) return (colIdx === 0 ? 'no' : 'en');
          let sampleText = "";
          for(let i=0; i<Math.min(20, rawRows.length); i++) {
              if(rawRows[i] && rawRows[i][colIdx]) {
                  sampleText += " " + rawRows[i][colIdx].toString().toLowerCase() + " ";
              }
          }
          const langSignatures = {
              en: { chars: [], words: [" the ", " be ", " to ", " of ", " and ", " in ", " that ", " have ", " it ", " is "] },
              no: { chars: ["æ", "ø", "å"], words: [" og ", " det ", " er ", " til ", " en ", " av ", " for ", " med ", " at ", " ikke ", " som ", " på ", " vi "] },
              it: { chars: ["à", "è", "é", "ì", "í", "ò", "ù"], words: [" il ", " di ", " la ", " un ", " in ", " che ", " non ", " sono ", " con ", " una ", " per "] },
              es: { chars: ["ñ", "¿", "¡", "á", "é", "í", "ó", "ú"], words: [" el ", " de ", " que ", " en ", " un ", " ser ", " se ", " no ", " por ", " con ", " la ", " para "] },
              fr: { chars: ["œ", "ç", "à", "â", "é", "è", "ê", "ë", "î", "ï", "ô", "ù", "û", "ü"], words: [" le ", " de ", " un ", " est ", " et ", " il ", " les ", " en ", " que ", " la ", " pour "] },
              de: { chars: ["ä", "ö", "ü", "ß"], words: [" der ", " die ", " und ", " in ", " den ", " von ", " zu ", " das ", " mit ", " sich ", " auf ", " für "] }
          };
          let scores = { en: 0, no: 0, it: 0, es: 0, fr: 0, de: 0 };
          for (const [lang, sig] of Object.entries(langSignatures)) {
              sig.chars.forEach(char => {
                  let matches = sampleText.split(char).length - 1;
                  scores[lang] += matches * 5;
              });
              sig.words.forEach(word => {
                  let matches = sampleText.split(word).length - 1;
                  scores[lang] += matches * 2;
              });
          }
          let bestLang = (colIdx === 0 ? 'no' : 'en');
          let maxScore = 0;
          for (const [lang, score] of Object.entries(scores)) {
              if (score > maxScore) {
                  maxScore = score;
                  bestLang = lang;
              }
          }
          return bestLang;
      }
      function initLanguages() {
        const savedDeckId = localStorage.getItem('srs_selected_deck_id') || "default";
        let savedA = localStorage.getItem('srs_langA_' + savedDeckId);
        let savedB = localStorage.getItem('srs_langB_' + savedDeckId);
        let savedHeaderA = localStorage.getItem('srs_headerA_' + savedDeckId);
        let savedHeaderB = localStorage.getItem('srs_headerB_' + savedDeckId);
        let codeA = savedA || detectLangFromRows(0, rawData.rawRows);
        let codeB = savedB || detectLangFromRows(1, rawData.rawRows);
        let idxA = savedHeaderA ? rawData.headers.indexOf(savedHeaderA) : 0;
        let idxB = savedHeaderB ? rawData.headers.indexOf(savedHeaderB) : 1;
        if (idxA < 0 || idxA >= rawData.headers.length) idxA = 0;
        if (idxB < 0 || idxB >= rawData.headers.length || idxB === idxA) idxB = idxA === 0 ? 1 : 0;
        selectedPair = { idxA: idxA, idxB: idxB, codeA: codeA, codeB: codeB, headerA: rawData.headers[idxA], headerB: rawData.headers[idxB] };
        localStorage.setItem('srs_headerA_' + savedDeckId, selectedPair.headerA || '');
        localStorage.setItem('srs_headerB_' + savedDeckId, selectedPair.headerB || '');

      }
      function resolvePairColumns() {
        if (!rawData || !rawData.headers || !selectedPair) return;
        // Headers are the stable anchor. Language-name matching is only used
        // when a saved header was removed or renamed in the spreadsheet.
        const idxA = selectedPair.headerA ? rawData.headers.indexOf(selectedPair.headerA) : -1;
        const idxB = selectedPair.headerB ? rawData.headers.indexOf(selectedPair.headerB) : -1;
        const findLanguageHeader = (code, excludedIdx) => {
          const terms = [code, getNativeLangName(code)].filter(Boolean).map(term => term.toLowerCase());
          return rawData.headers.findIndex((header, index) => {
            if (index === excludedIdx || header.trim().toLowerCase() === 'srs card id') return false;
            const normalized = header.toLowerCase();
            return terms.some(term => normalized === term || normalized.indexOf(term) !== -1);
          });
        };
        selectedPair.idxA = idxA >= 0 ? idxA : findLanguageHeader(selectedPair.codeA, -1);
        selectedPair.idxB = idxB >= 0 ? idxB : findLanguageHeader(selectedPair.codeB, selectedPair.idxA);
        if (selectedPair.idxA < 0) selectedPair.idxA = 0;
        if (selectedPair.idxB < 0 || selectedPair.idxB === selectedPair.idxA) selectedPair.idxB = selectedPair.idxA === 0 ? 1 : 0;
        selectedPair.headerA = rawData.headers[selectedPair.idxA];
        selectedPair.headerB = rawData.headers[selectedPair.idxB];
      }
      function isEnglish(code) { return !code || code.toLowerCase().trim() === 'en'; }
      function cleanString(str) {
        // Used for duplicate detection and answer comparison, not for display.
        if (!str) return '';
        return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'«»]/g, '').replace(/\s+/g, ' ').trim();
      }
      function levenshteinDistance(a, b) {
        // Dynamic programming gives edit distance for typing mode without an
        // external dependency; callers decide what distance is acceptable.
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; }
            else { matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1); }
          }
        }
        return matrix[b.length][a.length];
      }
      function updateWindowModeUI() {
        const btnPop = $('popoutToggleBtn'); const btnWeb = $('btnWebApp');
        const isWebApp = (window.IS_WEB_APP === true);
        if (isWebApp) {

        } else {

          }
