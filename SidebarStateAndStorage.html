    <script>
      document.addEventListener('keydown', function(e) {
        ensureDomCache();
        const quizView = $('viewQuiz');
        if (!quizView || quizView.style.display === 'none') return;
        const activeEl = document.activeElement;
        const isTypingInput = activeEl && activeEl.tagName === 'INPUT';
        if (isTypingInput && (e.key === 'Enter' || e.key === ' ')) return;
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (currentMode === 'flip' && revealBtnEl && revealBtnEl.style.display !== 'none') { revealFlip(); }
          else if (nextBtnEl && nextBtnEl.style.display !== 'none') {
            if (Date.now() - lastFeedbackTime < 600) return;
            renderNextCard();
          }
        }
        if (currentMode === 'flip') {
          if (flipAnswerAreaEl && flipAnswerAreaEl.style.display !== 'none') {
            const confKeys = ['again', 'hard', 'good', 'easy'];
            if (['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); selectFlipConfidence(confKeys[parseInt(e.key, 10) - 1]); }
            else if ((e.key === 'Enter' || e.key === ' ') && flipSubmitEl && !flipSubmitEl.disabled) { e.preventDefault(); submitFlipSelection(); }
          }
        } else if (currentMode === 'mcq' || currentMode === 'cloze_mcq') {
          if (['1', '2', '3', '4'].includes(e.key)) {
            e.preventDefault();
            const idx = parseInt(e.key, 10) - 1;
            const mcqBtn = $(`mcq${idx}`);
            if (mcqBtn && !mcqBtn.disabled) checkMCQ(idx);
          }
        } else if (currentMode === 'tf') {
          if (e.key.toLowerCase() === 't' || e.key === '1') {
            e.preventDefault();
            const trueBtn = $('tfTrueBtn');
            if (trueBtn && !trueBtn.disabled) checkTF(true);
          } else if (e.key.toLowerCase() === 'f' || e.key === '2') {
            e.preventDefault();
            const falseBtn = $('tfFalseBtn');
            if (falseBtn && !falseBtn.disabled) checkTF(false);
          }
        }
      });
      window.onload = function() {
        initDomCache();
        const savedTheme = localStorage.getItem('srs_app_theme') || 'kurskollektivet';

        try { leechProgress = JSON.parse(localStorage.getItem('srs_leech_progress') || '{}') || {}; } catch (e) { leechProgress = {}; }
        setupLifecycleSync();

        });

      function loadFlashcardData(onFailure) {

          .getFlashcardData(savedDeckId, getClientTodayStr(), getClientTimeZone(), savedHeaderA, savedHeaderB);

      function initApp(data) {

          data.studiedToday = {

            oldCount: (serverStudied.oldCount || 0) + pendingToday.filter(result => !result.wasNew).length
          };
        }

      const INTERVAL_STAGES = [1 / 24, 3, 7, 14, 30, 60, 90, 180, 359, 360];
