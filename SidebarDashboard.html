    <script>
      /* SidebarDashboard — dashboard rendering and session plumbing.

        nextDueTimestamp = Infinity;
        if (!selectedPair || !rawData || !rawData.rawRows) { renderDashboard(stageCounts); return; }

        const nowMs = Date.now();
        const pendingIds = new Set((pendingBatchResults || []).map(result => result.cardId));
        rawData.rawRows.forEach((row, rowIndex) => {
          let front = row[selectedPair.idxA] ? row[selectedPair.idxA].toString().trim() : "";
          let back = row[selectedPair.idxB] ? row[selectedPair.idxB].toString().trim() : "";
          if (!front || !back) return;
          let cardId = rawData.cardIds[rowIndex];
          let progressId = `${cardId}:::pair:${selectedPair.idxA}:${selectedPair.idxB}`;
          let cardState = rawData.savedProgress ? rawData.savedProgress[progressId] : null;
          let isNew = !cardState;
          let interval = cardState ? (parseFloat(cardState.interval) || 1) : 1;
          let ef = cardState ? (parseFloat(cardState.ef) || 2.5) : 2.5;
          let nextReviewStr = cardState ? (cardState.nextReview || todayStr) : todayStr;
          let failCount = cardState ? (parseFloat(cardState.failCount) || 0) : 0;
          let isLeech = cardState ? (cardState.isLeech || failCount >= 1) : false;
          const nextReviewMs = parseReviewDateMs(nextReviewStr, nowMs);
          let isDue = (!isNew && nextReviewMs <= nowMs);
          let card = {
            id: cardId, progressId: progressId, front: front, back: back, interval: interval, nextReview: nextReviewStr, ef: ef,
            langA: selectedPair.codeA, langB: selectedPair.codeB, isNew: isNew, failCount: failCount,
            isLeech: isLeech, rowIndex: rowIndex + 2, colIdxA: selectedPair.idxA, colIdxB: selectedPair.idxB
          };
          allCards.push(card);
          const cleanFront = cleanString(front);
          const cleanBack = cleanString(back);
          if (!quickAddSourceIndex.has('a:' + cleanFront)) quickAddSourceIndex.set('a:' + cleanFront, card);
          if (!quickAddSourceIndex.has('b:' + cleanBack)) quickAddSourceIndex.set('b:' + cleanBack, card);
          quickAddCardIndex.set(cleanFront + ':::' + cleanBack, card);
          front.split(/\s+/).forEach(word => { if (cleanString(word).length >= 2) quizDistractorWords.front.push(word); });
          back.split(/\s+/).forEach(word => { if (cleanString(word).length >= 2) quizDistractorWords.back.push(word); });

          stageCounts[stage] = (stageCounts[stage] || 0) + 1;

          if (pendingIds.has(progressId)) {
            card.isNew = false;
          } else if (isLeech) {
            // Leech cards are exclusive to difficult study until cleared; they

          } else if (isNew) {
            newPool.push(card);

        const newIds = new Set(newPool.map(c => c.id));

      function startCountdown(targetMs) {

          const t = i18n[currentUiLang] || i18n.en;
          const diff = targetMs - Date.now();
          if (diff <= 0) {
            clearInterval(dueCountdownInterval);
            btn.innerText = `🚀 ${t.dueReadyRefresh || "Due Cards Ready! (Click to Refresh)"}`;
            btn.disabled = false;
            btn.onclick = () => showDashboard();
            return;
          }
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diff % (1000 * 60)) / 1000);
          let timeStr = "";
          if (days > 0) timeStr += `${days}${t.unitD || 'd'} `;
          if (hrs > 0 || days > 0) timeStr += `${hrs}${t.unitH || 'h'} `;
          timeStr += `${mins}${t.unitM || 'm'} ${secs}${t.unitS || 's'}`;

        };

      }
      const heatmapWindowOffsets = { '7': 0, '30': 0, '365': 0 };
      function getIsoWeekInfo(dateObj) {
        const dUtc = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
        const dayNum = dUtc.getUTCDay() || 7;
        dUtc.setUTCDate(dUtc.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(dUtc.getUTCFullYear(), 0, 1));
        const isoWeek = Math.ceil((((dUtc - yearStart) / 86400000) + 1) / 7);
        const isoYear = dUtc.getUTCFullYear();
        const monday = new Date(dUtc);
        monday.setUTCDate(dUtc.getUTCDate() - 3);
        const sunday = new Date(monday);
        sunday.setUTCDate(monday.getUTCDate() + 6);
        return {
          key: `${isoYear}-W${isoWeek}`,
          monday: new Date(monday.getUTCFullYear(), monday.getUTCMonth(), monday.getUTCDate()),
          sunday: new Date(sunday.getUTCFullYear(), sunday.getUTCMonth(), sunday.getUTCDate())
        };
      }

      }

      }

      let lastBadgeHistoryRef = null;

      function renderGamificationBadges() {

                const dayNum = dUtc.getUTCDay() || 7;
                dUtc.setUTCDate(dUtc.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(dUtc.getUTCFullYear(), 0, 1));
                const weekKey = dUtc.getUTCFullYear() + "-W" + Math.ceil((((dUtc - yearStart) / 86400000) + 1) / 7);
                weekMap[weekKey] = (weekMap[weekKey] || 0) + 1;

                // Count every ISO week including the in-progress one, so active

                const days = weekMap[weekKey];

                  if (days >= b.req) {
                    badgeCounts[b.id]++;

                      badge: b,

                    });
                  }

              });
              Object.keys(monthMap).sort().forEach(monthKey => {
                const days = monthMap[monthKey];

                    badgeCounts[b.id]++;
